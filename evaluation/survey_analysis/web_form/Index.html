<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FORME • Hair Study</title>
<style>
:root{--ink:#292332;--muted:#827b89;--paper:#f7f5f0;--white:#fff;--purple:#514167;--lav:#eee8f3;--line:#e8e3ea;--green:#3f7665;--orange:#ab7249}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Tahoma,'Noto Sans Thai',Arial,sans-serif;font-size:14px;line-height:1.65}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--purple);color:white;font-weight:600}button:disabled{opacity:.45;cursor:wait}button.secondary{background:white;border:1px solid var(--line);color:var(--ink)}button.ghost{background:transparent;color:var(--purple)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ad94c9;outline-offset:3px}input,select{border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px;color:var(--ink)}a{color:var(--purple)}.brand{font-family:Georgia,serif;letter-spacing:3px;font-size:28px;line-height:1}.brand small{display:block;font:9px Arial;letter-spacing:3px;margin-top:9px;color:var(--muted)}header{display:flex;align-items:center;justify-content:space-between;padding:24px 5vw;border-bottom:1px solid var(--line);background:#fffaf6;gap:12px}.eyebrow{text-transform:uppercase;font:11px Arial;letter-spacing:2px;color:var(--purple);margin-bottom:16px}h1,h2,h3,p{margin-top:0}h1{font-size:36px;line-height:1.45;font-weight:500;letter-spacing:-1px}h2{font-size:23px;font-weight:500}h3{font-size:16px;margin-bottom:8px}.muted{color:var(--muted)}.small{font-size:12px}.badge{display:inline-block;background:var(--lav);color:var(--purple);padding:5px 12px;border-radius:30px;font-size:11px}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{max-width:1320px;padding:32px 4vw 64px;margin:auto}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px}.login{max-width:1120px;display:grid;grid-template-columns:1.15fr 1fr;min-height:650px;margin:35px auto;background:white;border-radius:28px;overflow:hidden;border:1px solid var(--line)}.intro{background:#e9e1ed;padding:50px;position:relative;overflow:hidden}.intro h1{max-width:410px}.intro p{max-width:390px}.art{height:265px;display:flex;gap:15px;align-items:center;margin:28px 0}.portrait{width:43%;background:#f8f2eb;border-radius:90px 90px 18px 18px;overflow:hidden;border:7px solid #f4edf5;box-shadow:0 20px 30px #51416716;transform:rotate(-5deg)}.portrait:last-child{transform:rotate(7deg);margin-top:25px}.portrait svg{display:block;width:100%}.loginform{padding:55px 44px;display:flex;justify-content:center;flex-direction:column}.loginform input{width:100%;letter-spacing:7px;font-size:23px;text-align:center;margin:10px 0 18px}.loginform .primary{width:100%;padding:16px}.hint{padding:14px;background:var(--paper);border-radius:12px;font-size:12px;margin:22px 0}.steps{display:flex;gap:20px;margin:22px 0;color:var(--purple);font-size:12px}.titlebar{margin-bottom:25px;display:flex;justify-content:space-between;align-items:center;gap:24px}.progress{height:6px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:10px}.progress div{height:100%;background:var(--purple);transition:width .3s}.evalgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr);gap:24px;align-items:start}.imagestack{position:sticky;top:18px}.refs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.imagebtn{display:block;background:var(--paper);width:100%;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.imagebtn img{display:block;width:100%;height:165px;object-fit:contain}.imagecaption{font-size:11px;color:var(--muted);padding-top:7px;text-align:center}.result{position:relative;background:#ede8e1;border-radius:16px;overflow:hidden}.result .imagebtn{border:0;border-radius:0}.result img{width:100%;height:365px;object-fit:contain}.resultlabel{position:absolute;left:15px;top:15px;background:#ffffffdd;border-radius:20px;padding:6px 14px;font-size:11px;pointer-events:none}.rating{border-bottom:1px solid var(--line);padding:16px 0}.rating:first-child{padding-top:4px}.question{display:flex;gap:10px;margin-bottom:10px;align-items:baseline}.num{font:11px Arial;color:var(--purple);background:var(--lav);border-radius:8px;padding:5px 7px}.choices{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.choice{background:#faf9fb;color:var(--muted);border:1px solid var(--line);padding:9px 2px;border-radius:10px;font-size:17px}.choice small{font-size:8px;display:block;font-weight:400}.choice.active{background:var(--purple);border-color:var(--purple);color:white}.waitchoices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.waitchoices button{font-size:11px;font-weight:400;padding:10px 5px}.savebar{display:flex;gap:10px;justify-content:space-between;margin-top:20px}.outline{border:1px solid var(--line);background:white;color:var(--ink)}.done{max-width:650px;text-align:center;margin:50px auto}.done .mark{font-size:40px;border-radius:50%;background:var(--lav);color:var(--purple);width:90px;height:90px;margin:0 auto 28px;padding:12px}.admin{display:grid;grid-template-columns:195px 1fr;min-height:calc(100vh - 97px)}aside{padding:30px 20px;background:#f1edf4;border-right:1px solid var(--line)}aside button{display:block;width:100%;text-align:left;margin-bottom:8px;background:transparent;color:var(--muted);padding:12px;font-weight:400}aside button.active{background:var(--purple);color:white}.adminmain{padding:30px;min-width:0}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.kpi{padding:20px}.kpi strong{display:block;font:33px Georgia;margin:8px 0}.kpi p{font-size:11px;margin:0;color:var(--muted)}.dashgrid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-bottom:20px}.legend{display:flex;gap:15px;font-size:11px;color:var(--muted);margin:15px 0}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--purple)}.dot.alt{background:#baa6cb}.barline{margin:17px 0}.barlabel{display:flex;justify-content:space-between;font-size:12px}.track{height:9px;background:var(--paper);border-radius:5px;margin-top:6px;overflow:hidden}.fill{height:100%;background:var(--purple);border-radius:5px}.fill.alt{background:#baa6cb}.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.filters select{font-size:12px;padding:9px 12px}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{background:#f8f6fa;color:var(--muted);font-weight:400}th,td{padding:12px;border-bottom:1px solid var(--line)}.tablewrap{overflow:auto}.status{background:#edf5f0;color:var(--green);border-radius:30px;padding:4px 9px;white-space:nowrap}.status.wait{background:#faf0e5;color:var(--orange)}.empty{padding:35px;text-align:center;color:var(--muted)}.demo{background:#f2e9db;color:#7c603c;padding:8px 20px;text-align:center;font-size:11px}.adminassets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.uploadcard{border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}.uploadcard input[type=file]{width:100%;font-size:10px;padding:8px}.uploadpreview{height:170px;background:var(--paper);border-radius:10px;margin:12px 0;display:flex;align-items:center;justify-content:center}.uploadpreview img{max-width:100%;max-height:100%;object-fit:contain}.uploadpreview img[hidden]{display:none}#accountdialog{width:460px}@media(max-width:760px){.adminassets{grid-template-columns:1fr 1fr}}@media(max-width:450px){.adminassets{grid-template-columns:1fr}}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:13px;padding:12px 24px;max-width:90vw;z-index:10;box-shadow:0 8px 30px #0002}.error{color:#ab384a;font-size:12px;min-height:22px}footer{padding:15px;text-align:center;color:var(--muted);font-size:10px}dialog{border:0;border-radius:20px;max-width:90vw;max-height:90vh;padding:20px}dialog::backdrop{background:#292332bb}dialog img{display:block;max-width:80vw;max-height:72vh;object-fit:contain}.demojump{display:flex;gap:10px;margin-top:10px}.demojump button{font-size:11px;flex:1}
@media(min-width:1400px){.login{margin-top:60px}.intro{padding-top:65px}}@media(max-width:1050px){.admin{grid-template-columns:1fr}aside{display:flex;gap:7px;overflow:auto;padding:12px}aside button{white-space:nowrap;width:auto;margin:0}.dashgrid{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.evalgrid{grid-template-columns:1fr 1fr}.refs img{height:125px}}@media(max-width:760px){header{padding:19px 20px}.brand{font-size:23px}h1{font-size:29px}.login{display:block;margin:20px;border-radius:22px;min-height:0}.intro{padding:30px}.intro .art{display:none}.intro h1{margin-bottom:12px}.intro .steps{margin-bottom:0}.loginform{padding:30px}.wrap{padding:24px 16px}.evalgrid{grid-template-columns:1fr}.imagestack{position:static}.titlebar{align-items:flex-start}.titlebar h1{font-size:24px;margin-bottom:6px}.card{padding:18px}.refs img{height:130px}.result img{height:310px}.adminmain{padding:20px 14px}.kpi strong{font-size:27px}.kpis{gap:10px}.titlebar .row{flex-wrap:wrap;justify-content:flex-end}.savebar{position:sticky;bottom:8px;background:white;padding:10px 0}.steps{gap:12px}.headerinfo{font-size:11px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div><dialog id="zoom"><form method="dialog"><button class="secondary" style="float:right">ปิด ✕</button></form><img id="zoomimg" alt="ภาพขยาย"></dialog><dialog id="accountdialog"></dialog><div id="live" aria-live="polite"></div>
<script>
'use strict';
const DEMO=!(window.google&&google.script&&google.script.run);
const QUESTIONS=['ทรงผมใกล้เคียงกับภาพอ้างอิงมากเพียงใด?','สีผมตรงกับภาพอ้างอิงมากเพียงใด?','ภาพดูสมจริงและเป็นธรรมชาติมากเพียงใด?','ใบหน้ายังคงเหมือนตัวคุณมากเพียงใด?','คุณพึงพอใจกับภาพนี้สำหรับการใช้งานจริงมากเพียงใด?'];
const WAIT=['น้อยกว่า 1 นาที','1–5 นาที','มากกว่า 5–10 นาที','มากกว่า 10–20 นาที','มากกว่า 20–40 นาที','มากกว่า 40 นาที'];
const state={token:null,role:null,participant:null,items:[],index:0,answers:{},image:null,busy:false,tab:'overview',data:null,management:null,filters:{model:'',variant:'',participant:''}};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){document.getElementById('live').innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>document.getElementById('live').innerHTML='',4000)}
function portrait(color='#493934',style=0){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450" viewBox="0 0 400 450"><rect width="400" height="450" fill="#e9e2d8"/><circle cx="200" cy="200" r="164" fill="#f1ede5"/><path d="M67 450 Q74 337 155 327 L245 327 Q326 337 333 450" fill="#5a5561"/><path d="M164 288 L164 333 Q200 362 236 333 L236 288" fill="#c38b6d"/><ellipse cx="120" cy="216" rx="15" ry="28" fill="#dba382"/><ellipse cx="280" cy="216" rx="15" ry="28" fill="#dba382"/><path d="M120 148 Q125 82 200 81 Q278 84 280 150 L272 252 Q257 307 200 319 Q143 307 128 252Z" fill="#dfac8a"/><path d="${style?'M116 208 L113 147 Q103 66 186 53 Q285 41 289 150 L281 207 L266 166 Q208 139 199 96 Q170 162 128 170Z':'M116 204 L112 149 Q111 74 197 64 Q282 65 288 153 L280 205 L264 158 Q216 180 149 157 L128 176Z'}" fill="${color}"/><path d="M143 206 Q160 197 179 205 M221 205 Q240 197 257 206" stroke="#49382f" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="163" cy="220" rx="5" ry="6" fill="#382f2c"/><ellipse cx="239" cy="220" rx="5" ry="6" fill="#382f2c"/><path d="M202 219 L195 252 L207 253" stroke="#bf8264" stroke-width="4" fill="none"/><path d="M176 277 Q201 284 225 275" stroke="#9c614e" stroke-width="4" fill="none" stroke-linecap="round"/><text x="200" y="427" text-anchor="middle" fill="#fff" font-family="Arial" font-size="12">ILLUSTRATION • DEMO</text></svg>`)}
function swatch(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="400" height="450"><defs><linearGradient id="g"><stop stop-color="#675343"/><stop offset=".5" stop-color="#a28c76"/><stop offset="1" stop-color="#66513f"/></linearGradient><pattern id="p" width="6" height="450" patternUnits="userSpaceOnUse"><path d="M3 0 Q-1 150 3 450" stroke="#ffffff30" fill="none"/></pattern></defs><rect width="400" height="450" fill="url(#g)"/><rect width="400" height="450" fill="url(#p)"/><text x="200" y="415" text-anchor="middle" fill="white" font-family="Arial" font-size="17">ASH BROWN • DEMO</text></svg>')}
function api(name,...args){if(DEMO)return Promise.resolve(demoApi(name,...args));return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'เชื่อมต่อไม่สำเร็จ')))[name](...args))}
function demoRows(){const out=[];for(let p=1;p<=40;p++){const n=p<19?20:p<30?8:0;for(let i=0;i<n;i++)out.push({participant_id:'U'+String(p).padStart(3,'0'),image_id:'D'+p+'_'+i,model:i%2?'Barbershop':'FGAN',tuning_variant:'V'+(i%4+1),pair_id:'C'+Math.floor(i/2),q1:3+(p+i)%3,q2:2+(p+i)%4,q3:3+(p*2+i)%3,q4:3+(p+i*2)%3,q5:3+(p+i)%3,wait_bin:(p+i)%6,generation_seconds:i%2?2400:120,updated_at:'2026-10-10T10:00:00Z'});}return out}

function header(info=''){return `${DEMO?'<div class="demo">ต้นแบบทดลอง • ภาพและสถิติเป็นข้อมูลสมมติ • ยังไม่เชื่อม Google Sheets</div>':''}<header><div class="brand">FORME<small>HAIR STUDY</small></div><div class="row headerinfo">${info}${state.role?'<button class="ghost" onclick="logout()">ออกจากระบบ ↗</button>':'<span class="muted small">แบบประเมินทรงผมเสมือนจริง</span>'}</div></header>`}
function renderLogin(){state.role=null;document.getElementById('app').innerHTML=header()+`<main class="login"><section class="intro"><div class="eyebrow">YOUR LOOK. YOUR PERSPECTIVE.</div><h1>ทรงผมที่ใช่<br>เริ่มจากมุมมองของคุณ</h1><p class="muted">ร่วมประเมินภาพจำลองทรงผมและสีผม เพื่อพัฒนาประสบการณ์ทดลองทรงผมที่ดีขึ้น</p><div class="art"><div class="portrait"><img width="100%" src="${portrait()}" alt="ภาพประกอบต้นฉบับ"></div><div class="portrait"><img width="100%" src="${portrait('#8e7962',1)}" alt="ภาพประกอบผลลัพธ์"></div></div><div class="steps"><span>01 เข้าสู่ระบบ</span><span>02 ดูภาพเปรียบเทียบ</span><span>03 ให้คะแนน</span></div></section><section class="loginform"><span class="eyebrow">WELCOME TO FORME</span><h2>ยินดีต้อนรับ</h2><p class="muted">ใช้รหัสที่ได้รับจากผู้วิจัยเพื่อเริ่มประเมิน<br>ผู้ดูแลใช้รหัสส่วนตัวเพื่อเข้าสู่แดชบอร์ด</p><form onsubmit="signIn(event)"><label for="code" class="small">รหัสเข้าสู่ระบบ</label><input id="code" type="password" inputmode="numeric" autocomplete="off" minlength="6" maxlength="12" required placeholder="••••••" aria-describedby="loginerror"><div id="loginerror" class="error" role="alert"></div><button id="loginbtn" class="primary" type="submit">เข้าสู่ระบบ →</button></form><div class="hint">ประมาณ 20 ภาพ · ภาพละ 6 คำถาม<br>บันทึกเมื่อกดไปภาพถัดไป และกลับมาทำต่อได้</div><p class="small muted">ภาพแสดงเฉพาะผู้เข้าร่วมที่ได้รับสิทธิ์ กรุณาไม่ส่งต่อรหัสของคุณ</p>${DEMO?'<div class="demojump"><button class="secondary" onclick="demoSign(\'123456\')">ลองหน้าผู้ประเมิน</button><button class="secondary" onclick="demoSign(\'999999\')">ลองแดชบอร์ด</button></div>':''}</section></main>`}
async function demoSign(code){document.getElementById('code').value=code;await signIn({preventDefault(){}})}
async function signIn(e){e.preventDefault();const btn=document.getElementById('loginbtn');btn.disabled=true;try{const res=await api('login',document.getElementById('code').value.trim());state.token=res.token;state.role=res.role;state.participant=res.participant_id;if(res.role==='admin'){await reloadAdminData();renderAdmin()}else{const r=await api('getParticipant',state.token);state.items=r.items;state.answers=r.answers;state.index=Math.max(0,state.items.findIndex(x=>!state.answers[x.image_id]));if(state.items.length&&Object.values(state.answers).filter(a=>!a._draft).length===state.items.length)renderDone();else await showImage()}}catch(err){state.role=null;document.getElementById('loginerror').textContent=err.message;btn.disabled=false}}
async function logout(){if(state.busy)return;editor=null;try{await api('logout',state.token)}catch(e){}Object.assign(state,{token:null,role:null,answers:{},items:[],image:null,data:null,management:null,filters:{model:'',variant:'',participant:''},tab:'overview'});renderLogin()}
async function showImage(){state.busy=true;state.image=null;renderEvaluation();try{if(state.items.length)state.image=await api('getImage',state.token,state.items[state.index].image_id);state.busy=false;renderEvaluation()}catch(e){state.busy=false;renderEvaluation();toast(e.message)}}
function imageCard(key,label){const url=state.image&&state.image[key];return `<div><button class="imagebtn" type="button" ${url?'':'disabled'} onclick="zoomImage('${key}')" aria-label="ขยาย${label}">${url?`<img src="${esc(url)}" alt="${label}">`:'<div class="empty">'+(state.busy?'กำลังโหลดภาพ…':'โหลดภาพไม่ได้')+'</div>'}</button><div class="imagecaption">${label}</div></div>`}
function renderEvaluation(){const n=state.items.length,done=Object.values(state.answers).filter(a=>!a._draft).length,item=state.items[state.index];if(!item){document.getElementById('app').innerHTML=header()+`<main class="wrap card empty"><h2>ยังไม่มีภาพที่ได้รับมอบหมาย</h2><p>กรุณาติดต่อผู้วิจัยเพื่อเพิ่มภาพของคุณ</p></main>`;return}const a=state.answers[item.image_id]||{q1:0,q2:0,q3:0,q4:0,q5:0,wait_bin:null};state.current={...a};document.getElementById('app').innerHTML=header(`<span class="badge">ผู้เข้าร่วม ${esc(state.participant)}</span>`)+`<main class="wrap"><div class="titlebar"><div><div class="eyebrow">IMAGE EVALUATION</div><h1>ภาพนี้เป็นคุณมากแค่ไหน?</h1><p class="muted small">ดูภาพทั้ง 4 ส่วน แล้วให้คะแนนตามความรู้สึกของคุณ · แตะภาพเพื่อขยาย</p></div><div style="min-width:140px"><span class="small">ภาพที่ ${state.index+1} / ${n}</span><div class="progress"><div style="width:${done/n*100}%"></div></div><p class="small muted" style="margin-top:7px">ตอบครบ ${done} จาก ${n} ภาพ</p>${!state.image&&!state.busy?'<button class="secondary" onclick="refreshParticipant()">โหลดรายการใหม่</button>':''}</div></div><div class="evalgrid"><section class="card imagestack"><div class="row between"><h3>ภาพเปรียบเทียบ</h3><span class="badge">ชุดที่ ${String(state.index+1).padStart(2,'0')}</span></div><p class="small muted">เทียบทรงผม สีผม และใบหน้าในภาพผลลัพธ์</p><div class="refs">${imageCard('original','ใบหน้าต้นฉบับ')}${imageCard('hair','Reference ทรงผม')}${imageCard('color','Reference สีผม')}</div><div class="result"><span class="resultlabel">ภาพผลลัพธ์ ${String(state.index+1).padStart(2,'0')}</span>${imageCard('result','ผลลัพธ์ที่กำลังประเมิน')}</div></section><section class="card"><h3>บอกเราว่าคุณรู้สึกอย่างไร</h3><p class="muted small">1 = น้อยที่สุด · 2 = น้อย · 3 = ปานกลาง · 4 = มาก · 5 = มากที่สุด</p>${QUESTIONS.map((q,i)=>`<div class="rating"><div class="question" id="q${i+1}"><span class="num">0${i+1}</span><span>${q}</span></div><div class="choices" role="group" aria-labelledby="q${i+1}">${[1,2,3,4,5].map(v=>`<button class="choice ${a['q'+(i+1)]===v?'active':''}" type="button" aria-pressed="${a['q'+(i+1)]===v}" onclick="rate(${i+1},${v},this)">${v}<small>${['น้อยที่สุด','น้อย','ปานกลาง','มาก','มากที่สุด'][v-1]}</small></button>`).join('')}</div></div>`).join('')}<div class="rating" style="border:0"><div class="question" id="waitq"><span class="num">06</span><span>หากต้องรอให้ระบบสร้างภาพที่มีคุณภาพเหมือนภาพนี้ คุณยินดีรอได้นานที่สุดเท่าใด?</span></div><div class="waitchoices" role="group" aria-labelledby="waitq">${WAIT.map((s,i)=>`<button class="choice ${a.wait_bin===i?'active':''}" aria-pressed="${a.wait_bin===i}" onclick="rateWait(${i},this)">${s}</button>`).join('')}</div></div><div id="saveerror" role="alert" class="error"></div><div class="savebar"><button class="secondary" ${state.index===0||state.busy?'disabled':''} onclick="navigate(-1)">← ย้อนกลับ</button><button id="savebtn" ${state.busy||!state.image?'disabled':''} onclick="saveNext()">${state.index===n-1?'บันทึกและส่งแบบประเมิน ✓':'บันทึกและไปภาพถัดไป →'}</button></div><p class="small muted" style="margin:10px 0 0">${state.busy?'กำลังโหลด…':'เลือกครบทั้ง 6 ข้อก่อนบันทึก'}</p></section></div></main>`}
function rate(q,v,btn){state.current['q'+q]=v;selectButton(btn)}function rateWait(v,btn){state.current.wait_bin=v;selectButton(btn)}function selectButton(btn){for(const b of btn.parentElement.children){b.classList.toggle('active',b===btn);b.setAttribute('aria-pressed',b===btn?'true':'false')}}
function zoomImage(key){if(!state.image)return;document.getElementById('zoomimg').src=state.image[key];document.getElementById('zoom').showModal()}
function stash(){const id=state.items[state.index].image_id,prev=state.answers[id];const dirty=!prev||['q1','q2','q3','q4','q5','wait_bin'].some(k=>prev[k]!==state.current[k]);if(dirty)state.answers[id]={...state.current,image_id:id,_draft:true}}

function renderDone(){document.getElementById('app').innerHTML=header(`<span class="badge">${esc(state.participant)}</span>`)+`<main class="wrap"><section class="card done"><div class="mark">✓</div><div class="eyebrow">THANK YOU FOR YOUR PERSPECTIVE</div><h1>ขอบคุณที่ร่วมประเมิน</h1><p class="muted">บันทึกคำตอบครบ ${state.items.length} ภาพแล้ว<br>ความคิดเห็นของคุณช่วยพัฒนาการทดลองทรงผมเสมือนจริง</p><button class="secondary" onclick="state.index=0;showImage()">ทบทวนคำตอบ</button><button onclick="logout()" style="margin-left:8px">กลับหน้าเข้าสู่ระบบ</button></section></main>`}
function filteredRows(){return (state.tab==='history'?(state.data.archived_responses||[]):state.data.responses).filter(r=>(!state.filters.model||r.model===state.filters.model)&&(!state.filters.variant||r.tuning_variant===state.filters.variant)&&(!state.filters.participant||r.participant_id===state.filters.participant))}
function mean(rs,q){return rs.length?rs.reduce((a,r)=>a+Number(r[q]),0)/rs.length:null}function fmt(v){return v===null?'—':v.toFixed(2)}
function filters(){return `<div class="filters"><select aria-label="กรองโมเดล" onchange="filter('model',this.value)"><option value="">ทุกโมเดล</option>${['FGAN','Barbershop'].map(v=>`<option ${state.filters.model===v?'selected':''}>${v}</option>`).join('')}</select><select aria-label="กรองการจูน" onchange="filter('variant',this.value)"><option value="">ทุกการจูน</option>${[...new Set(state.data.responses.map(r=>r.tuning_variant))].sort().map(v=>`<option ${state.filters.variant===v?'selected':''}>${esc(v)}</option>`).join('')}</select><select aria-label="กรองผู้เข้าร่วม" onchange="filter('participant',this.value)"><option value="">ผู้เข้าร่วมทั้งหมด</option>${(state.management?.participants||state.data.participants).map(p=>`<option ${state.filters.participant===p.participant_id?'selected':''}>${esc(p.participant_id)}</option>`).join('')}</select></div>`}
function filter(k,v){if(state.busy)return;editor=null;state.filters[k]=v;renderAdmin()}function tab(t){if(state.busy)return;editor=null;state.tab=t;renderAdmin()}
function overview(rows){const labels=['ตรงทรงผม','ตรงสีผม','ความสมจริง','คงใบหน้า','ความพึงพอใจ'];return `<div class="dashgrid"><section class="card"><h3>คุณภาพภาพ แยกตามโมเดล</h3><p class="small muted">ค่าเฉลี่ยแต่ละข้อ / 5 · ใช้เฉพาะคำตอบที่บันทึกครบ</p><div class="legend"><span><i class="dot"></i>FGAN</span><span><i class="dot alt"></i>Barbershop</span></div>${labels.map((l,i)=>{const f=mean(rows.filter(r=>r.model==='FGAN'),'q'+(i+1)),b=mean(rows.filter(r=>r.model==='Barbershop'),'q'+(i+1));return `<div class="barline"><div class="barlabel"><span>${l}</span><span>${fmt(f)} / ${fmt(b)}</span></div><div class="track"><div class="fill" style="width:${(f||0)*20}%"></div></div><div class="track"><div class="fill alt" style="width:${(b||0)*20}%"></div></div></div>`}).join('')}</section><section class="card"><h3>เวลารอที่ยอมรับได้</h3><p class="small muted">ตอบแยกทุกภาพ · ${rows.length} ชุดคำตอบ</p>${WAIT.map((l,i)=>{const count=rows.filter(r=>r.wait_bin===i).length,pct=rows.length?count/rows.length*100:0;return `<div class="barline"><div class="barlabel"><span>${l}</span><span>${pct.toFixed(1)}% · ${count}</span></div><div class="track"><div class="fill alt" style="width:${pct}%"></div></div></div>`}).join('')}<p class="small muted">ช่วงเวลาที่ผู้ใช้ยอมรอ แยกจากเวลาประมวลผลจริง และไม่ใช่คะแนน 1–5</p></section></div><section class="card"><h3>เปรียบเทียบโมเดลและการจูน</h3>${variantsTable(rows)}<p class="small muted" style="margin:15px 0 0">ค่าเฉลี่ยเป็นสถิติเชิงพรรณนา ไม่ใช่ข้อสรุปว่าชนะอย่างมีนัยสำคัญ · อย่ารวมคำตอบข้อเวลาเป็นคะแนนคุณภาพ</p></section>`}
function variantsTable(rows){const keys=[...new Set(rows.map(r=>r.model+'|'+r.tuning_variant))].sort();return `<div class="tablewrap"><table><thead><tr><th>โมเดล / การจูน</th><th>คำตอบ</th>${[1,2,3,4,5].map(i=>'<th>ข้อ '+i+'</th>').join('')}<th>เวลาเฉลี่ยจริง</th></tr></thead><tbody>${keys.map(k=>{const rs=rows.filter(r=>r.model+'|'+r.tuning_variant===k),times=rs.filter(r=>r.generation_seconds!==null&&r.generation_seconds!==''&&Number.isFinite(Number(r.generation_seconds)));return `<tr><td>${esc(k.replace('|',' / '))}</td><td>${rs.length}</td>${[1,2,3,4,5].map(i=>'<td>'+fmt(mean(rs,'q'+i))+'</td>').join('')}<td>${times.length?(times.reduce((a,r)=>a+Number(r.generation_seconds),0)/times.length/60).toFixed(1)+' นาที':'—'}</td></tr>`}).join('')||'<tr><td colspan="8" class="empty">ยังไม่มีคำตอบ</td></tr>'}</tbody></table></div>`}
function participantsTable(){return `<section class="card"><h3>ความคืบหน้ารายคน</h3><div class="tablewrap"><table><thead><tr><th>ผู้เข้าร่วม</th><th>บันทึกแล้ว</th><th>ความคืบหน้า</th><th>สถานะ</th><th></th></tr></thead><tbody>${state.data.participants.filter(p=>!state.filters.participant||p.participant_id===state.filters.participant).map(p=>{const n=state.data.responses.filter(r=>r.participant_id===p.participant_id).length,pct=p.total?n/p.total*100:0;return `<tr><td>${esc(p.participant_id)}</td><td>${n} / ${p.total}</td><td><div class="progress" style="width:100px;margin:0"><div style="width:${pct}%"></div></div></td><td><span class="status ${n===p.total&&p.total?'':'wait'}">${n===p.total&&p.total?'ครบแล้ว':n?'กำลังทำ':'ยังไม่เริ่ม'}</span></td><td><button class="ghost" data-id="${esc(p.participant_id)}" onclick="showPerson(this.dataset.id)">ดูคำตอบ →</button></td></tr>`}).join('')}</tbody></table></div></section>`}
function showPerson(id){state.filters.participant=id;state.tab='responses';renderAdmin()}
function responsesTable(rows){return `<section class="card"><h3>${state.tab==='history'?'ประวัติจากชุดที่ซ่อนหรือผู้ใช้ที่ระงับ':'คำตอบรายภาพ'}</h3><div class="tablewrap"><table><thead><tr><th>ผู้เข้าร่วม</th><th>รหัสภาพ</th><th>โมเดล</th><th>การจูน</th><th>คู่ทดลอง</th><th>คะแนน 1–5</th><th>เวลาที่ยอมรอ</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.participant_id)}</td><td>${esc(r.image_id)}</td><td>${esc(r.model)}</td><td>${esc(r.tuning_variant)}</td><td>${esc(r.pair_id)}</td><td>${[1,2,3,4,5].map(i=>r['q'+i]).join(' · ')}</td><td>${WAIT[r.wait_bin]}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">ยังไม่มีคำตอบตามตัวกรอง</td></tr>'}</tbody></table></div></section>`}
function renderAdmin(){const rows=filteredRows(),ps=state.data.participants,total=ps.reduce((a,p)=>a+p.total,0),complete=ps.filter(p=>p.total>0&&state.data.responses.filter(r=>r.participant_id===p.participant_id).length===p.total).length;document.getElementById('app').innerHTML=header('<span class="badge">ADMIN WORKSPACE</span>')+`<div class="admin"><aside><div class="eyebrow" style="margin-bottom:20px">RESEARCH CONSOLE</div>${[['overview','◫ ภาพรวมการทดลอง'],['participants','◎ ผู้เข้าร่วม'],['responses','≡ คำตอบรายภาพ'],['images','▣ จัดการชุดภาพ'],['accounts','♙ จัดการผู้ใช้'],['history','↶ ประวัติคำตอบ']].map(([t,l])=>`<button class="${state.tab===t?'active':''}" onclick="tab('${t}')">${l}</button>`).join('')}</aside><main class="adminmain"><div class="titlebar"><div><div class="eyebrow">RESEARCH DASHBOARD</div><h1 style="margin-bottom:6px">ทุกมุมมอง ในที่เดียว</h1><p class="small muted">สรุปผล FGAN และ Barbershop จากผู้เข้าร่วมทั้งหมด</p></div><div class="row"><button class="secondary" onclick="refreshAdmin()">↻ อัปเดต</button><button onclick="exportCSV()">ส่งออก CSV ↗</button></div></div><div class="kpis"><div class="card kpi"><p>ผู้เข้าร่วมทั้งหมด</p><strong>${ps.length}<span class="small muted"> คน</span></strong><p>เฉพาะสถานะ active</p></div><div class="card kpi"><p>ทำครบแล้ว</p><strong>${complete}<span class="small muted"> / ${ps.length}</span></strong><p>ประเมินครบทุกภาพที่มอบหมาย</p></div><div class="card kpi"><p>คำตอบที่บันทึก</p><strong>${state.data.responses.length}<span class="small muted"> / ${total}</span></strong><p>แต่ละชุดมี 6 คำตอบรายข้อ</p></div><div class="card kpi"><p>ความพึงพอใจ ข้อ 5</p><strong>${fmt(mean(rows,'q5'))}<span class="small muted"> / 5</span></strong><p>ตามตัวกรอง · ${rows.length} ชุดคำตอบ</p></div></div>${filters()}${state.tab==='overview'?overview(rows):state.tab==='participants'?participantsTable():state.tab==='images'?managementHTML():state.tab==='accounts'?accountsHTML():responsesTable(rows)}<footer>${DEMO?'ข้อมูลสมมติสำหรับสาธิตหน้าตาเท่านั้น':'ข้อมูลที่บันทึกใน Google Sheets'} · FORME Hair Study</footer></main></div>`}
async function refreshAdmin(){if(state.busy)return;editor=null;try{await reloadAdminData();renderAdmin();toast('อัปเดตข้อมูลแล้ว')}catch(e){toast(e.message)}}
function exportCSV(){const fields=['participant_id','image_id','model','tuning_variant','pair_id','q1','q2','q3','q4','q5','wait_bin','generation_seconds','updated_at'];const cell=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const csv='\ufeff'+[fields, ...filteredRows().map(r=>fields.map(k=>r[k]))].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='forme-'+(DEMO?'DEMO-':'')+'responses.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const enabled=r=>r.enabled===true||String(r.enabled).toLowerCase()==='true';
const adminAssetLabels={original:'ใบหน้าต้นฉบับ',hair:'Reference ทรงผม',color:'Reference สีผม',FGAN:'ผลลัพธ์ FGAN',Barbershop:'ผลลัพธ์ Barbershop'};
let pairList=[],editor=null,uploadSequence=0;
const demoStore={data:null,management:null,files:{},codes:{U001:'123456'}};
function initDemo(){if(demoStore.data)return;demoStore.data={participants:Array.from({length:40},(_,i)=>({participant_id:'U'+String(i+1).padStart(3,'0'),total:20,status:'active'})),responses:demoRows().filter(r=>r.participant_id!=='U001'),archived_responses:[]};demoStore.management={participants:demoStore.data.participants.map(p=>({participant_id:p.participant_id,status:p.status})),images:[]};for(let p=1;p<=40;p++)for(let i=0;i<20;i++){const id='D'+p+'_'+i,pid='U'+String(p).padStart(3,'0');demoStore.management.images.push({image_id:id,participant_id:pid,pair_id:'C'+Math.floor(i/2),model:i%2?'Barbershop':'FGAN',tuning_variant:'V'+(i%4+1),original_file_id:'demo-original',hair_file_id:'demo-hair',color_file_id:'demo-color',result_file_id:'demo-result-'+(i%2),generation_seconds:i%2?2400:120,enabled:true,fingerprint:id,answer_count:demoStore.data.responses.filter(r=>r.image_id===id).length});}Object.assign(demoStore.files,{'demo-original':portrait(),'demo-hair':portrait('#342d29',1),'demo-color':swatch(),'demo-result-0':portrait('#8e7962',1),'demo-result-1':portrait('#75604d',1)});}
function demoApi(name,...args){initDemo();if(name==='login'){const id=Object.keys(demoStore.codes).find(k=>demoStore.codes[k]===args[0]);if(args[0]!=='999999'&&!id)throw Error('รหัสตัวอย่าง: 123456 สำหรับผู้ประเมิน หรือ 999999 สำหรับแอดมิน');return {token:'demo',role:args[0]==='999999'?'admin':'participant',participant_id:id||null}}if(name==='getDashboard'){const m=demoStore.management,activePeople=new Set(m.participants.filter(p=>p.status==='active').map(p=>p.participant_id)),activeImages=new Set(m.images.filter(enabled).map(i=>i.image_id)),all=[...demoStore.data.responses,...demoStore.data.archived_responses];demoStore.data.responses=all.filter(r=>activePeople.has(r.participant_id)&&activeImages.has(r.image_id));demoStore.data.archived_responses=all.filter(r=>!activePeople.has(r.participant_id)||!activeImages.has(r.image_id));demoStore.data.participants=m.participants.filter(p=>p.status==='active').map(p=>({...p,total:m.images.filter(i=>i.participant_id===p.participant_id&&enabled(i)).length}));return demoStore.data}if(name==='getParticipant'){const pid=state.participant||'U001';return {participant_id:pid,items:demoStore.management.images.filter(i=>i.participant_id===pid&&enabled(i)).map(i=>({image_id:i.image_id})),answers:Object.fromEntries(demoStore.data.responses.filter(r=>r.participant_id===pid).map(r=>[r.image_id,r]))}}if(name==='getImage'){const r=demoStore.management.images.find(i=>i.image_id===args[1]&&i.participant_id===state.participant&&enabled(i));if(!r)throw Error('ชุดภาพเปลี่ยนแล้ว กรุณาโหลดรายการใหม่');return {original:demoStore.files[r.original_file_id],hair:demoStore.files[r.hair_file_id],color:demoStore.files[r.color_file_id],result:demoStore.files[r.result_file_id]}}if(name==='saveResponse'){const r=demoStore.management.images.find(i=>i.image_id===args[1].image_id&&i.participant_id===state.participant&&enabled(i));if(!r)throw Error('ชุดภาพเปลี่ยนแล้ว');const rs=demoStore.data.responses,index=rs.findIndex(a=>a.participant_id===state.participant&&a.image_id===r.image_id),answer={...args[1],participant_id:state.participant,model:r.model,tuning_variant:r.tuning_variant,pair_id:r.pair_id,generation_seconds:r.generation_seconds,updated_at:new Date().toISOString()};if(index<0)rs.push(answer);else rs[index]=answer;return {ok:true}}if(name==='adminGetManagement'){const answers=[...demoStore.data.responses,...demoStore.data.archived_responses];demoStore.management.images.forEach(i=>i.answer_count=answers.filter(r=>r.image_id===i.image_id&&r.participant_id===i.participant_id).length);return demoStore.management;}if(name==='adminReadImage'){const r=demoStore.management.images.find(i=>i.image_id===args[1]);return {data:demoStore.files[r[args[2]+'_file_id']]}}if(name==='adminUploadImage'){const id='demo-upload-'+(++uploadSequence);demoStore.files[id]='data:'+args[1].mime+';base64,'+args[1].base64;return {file_id:id}}if(name==='adminResetCode'){const [t,pid,code]=args;if(Object.keys(demoStore.codes).some(k=>k!==pid&&demoStore.codes[k]===code))throw Error('รหัสนี้มีผู้ใช้แล้ว');demoStore.codes[pid]=code;return {ok:true,login_code:code}}if(name==='adminSetParticipantStatus'){demoStore.management.participants.find(p=>p.participant_id===args[1]).status=args[2];return {ok:true}}if(name==='adminSetPairEnabled'){demoStore.management.images.filter(i=>args[3].includes(i.image_id)).forEach(i=>i.enabled=args[4]);return {ok:true}}if(name==='adminSavePair'){const p=args[1],images=demoStore.management.images,current=p.records.map(r=>images.find(i=>i.image_id===r.image_id)),changed=current.some((o,i)=>o&&['original_file_id','hair_file_id','color_file_id'].some(k=>o[k]!==p[k])||o&&(o.result_file_id!==p.records[i].result_file_id||o.tuning_variant!==p.records[i].tuning_variant||String(o.generation_seconds)!==String(p.records[i].generation_seconds))),revised=changed;if(revised){current.forEach(o=>{if(o)o.enabled=false});const ids=current.filter(Boolean).map(o=>o.image_id),old=demoStore.data.responses.filter(r=>ids.includes(r.image_id));demoStore.data.archived_responses.push(...old);demoStore.data.responses=demoStore.data.responses.filter(r=>!ids.includes(r.image_id));}p.records.forEach((r,i)=>{const o=current[i],id=!revised&&o?o.image_id:'DEMO_NEW_'+(++uploadSequence);const n={image_id:id,participant_id:p.participant_id,pair_id:p.pair_id,model:r.model,tuning_variant:r.tuning_variant,original_file_id:p.original_file_id,hair_file_id:p.hair_file_id,color_file_id:p.color_file_id,result_file_id:r.result_file_id,generation_seconds:r.generation_seconds,enabled:p.enabled,fingerprint:id+'_'+uploadSequence,answer_count:!revised&&o?o.answer_count:0};if(!revised&&o)Object.assign(o,n);else images.push(n)});return {ok:true,revised}}if(name==='logout')return {ok:true};throw Error('ไม่พบคำสั่ง')}
function managementPairs(){const groups=new Map();for(const r of state.management.images){const key=r.participant_id+'|'+r.pair_id;let p=groups.get(key);if(!p){p={participant_id:r.participant_id,pair_id:r.pair_id,records:{}};groups.set(key,p)}const old=p.records[r.model];if(!old||enabled(r)||!enabled(old))p.records[r.model]=r;}return [...groups.values()].filter(p=>!state.filters.participant||p.participant_id===state.filters.participant)}
function managementHTML(){pairList=managementPairs();return `${editor?editorHTML():''}<section class="card"><div class="row between"><div><h3>จัดการชุดภาพของผู้เข้าร่วม</h3><p class="small muted">อ้างอิงร่วมกัน 3 ภาพ และผลลัพธ์จากสองโมเดล · ไม่ต้องประมวลผลใหม่</p></div><button onclick="newPair()">＋ เพิ่มชุดภาพ</button></div><div class="tablewrap"><table><thead><tr><th>ผู้เข้าร่วม / ชุด</th><th>FGAN</th><th>Barbershop</th><th>สถานะ</th><th>จัดการ</th></tr></thead><tbody>${pairList.map((p,i)=>{const f=p.records.FGAN,b=p.records.Barbershop,on=Object.values(p.records).some(enabled);return `<tr><td>${esc(p.participant_id)} / ${esc(p.pair_id)}</td><td>${f?esc(f.tuning_variant)+' · '+f.answer_count+' คำตอบ':'ยังไม่มี'}</td><td>${b?esc(b.tuning_variant)+' · '+b.answer_count+' คำตอบ':'ยังไม่มี'}</td><td><span class="status ${on?'':'wait'}">${on?'เปิดใช้อยู่':'ซ่อนอยู่'}</span></td><td><button class="ghost" onclick="editPair(${i})">แก้ไขภาพ</button><button class="ghost" onclick="togglePair(${i},${!on})">${on?'ซ่อนชุด':'เปิดชุด'}</button></td></tr>`}).join('')}</tbody></table></div><p class="small muted" style="margin-top:15px">ซ่อนชุดจะเก็บภาพและคะแนนเดิมไว้ ดูคำตอบจากชุดที่ซ่อนในเมนูประวัติได้</p></section>`}
function accountsHTML(){return `<section class="card"><h3>จัดการรหัสและสิทธิ์ผู้เข้าร่วม</h3><p class="small muted">เปลี่ยนรหัสแล้วเซสชันเดิมใช้งานต่อไม่ได้ คะแนนที่บันทึกไว้ยังอยู่</p><div class="tablewrap"><table><thead><tr><th>ผู้เข้าร่วม</th><th>สิทธิ์</th><th>รหัสเข้าสู่ระบบ</th><th>สถานะ</th></tr></thead><tbody>${state.management.participants.filter(p=>!state.filters.participant||p.participant_id===state.filters.participant).map(p=>`<tr><td>${esc(p.participant_id)}</td><td><span class="status ${p.status==='active'?'':'wait'}">${p.status==='active'?'ใช้งานได้':'ระงับ'}</span></td><td><button class="secondary" data-id="${esc(p.participant_id)}" onclick="openReset(this.dataset.id)">เปลี่ยนรหัส 6 หลัก</button></td><td><button class="ghost" data-id="${esc(p.participant_id)}" data-status="${p.status==='active'?'disabled':'active'}" onclick="setAccountStatus(this.dataset.id,this.dataset.status)">${p.status==='active'?'ระงับการเข้าใช้':'เปิดใช้งาน'}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function newPair(){if(state.busy)return;editor={isNew:true,participant_id:state.filters.participant||state.management.participants[0]?.participant_id||'',pair_id:'',enabled:true,assets:{},previews:{},files:{},records:{FGAN:{model:'FGAN',tuning_variant:'V1',generation_seconds:''},Barbershop:{model:'Barbershop',tuning_variant:'V1',generation_seconds:''}}};renderAdmin();document.getElementById('pairform').scrollIntoView?.({behavior:'smooth'})}
async function editPair(index){if(state.busy)return;const p=pairList[index],r=p.records.FGAN||p.records.Barbershop;editor={isNew:false,participant_id:p.participant_id,pair_id:p.pair_id,enabled:Object.values(p.records).some(enabled),assets:{original:r.original_file_id,hair:r.hair_file_id,color:r.color_file_id,FGAN:p.records.FGAN?.result_file_id,Barbershop:p.records.Barbershop?.result_file_id},previews:{},files:{},records:{FGAN:{model:'FGAN',tuning_variant:'V1',generation_seconds:'',...p.records.FGAN},Barbershop:{model:'Barbershop',tuning_variant:'V1',generation_seconds:'',...p.records.Barbershop}}};renderAdmin();document.getElementById('pairform').scrollIntoView?.({behavior:'smooth'});const target=editor;await Promise.all(Object.keys(adminAssetLabels).map(async key=>{const rec=key==='Barbershop'?p.records.Barbershop:key==='FGAN'?p.records.FGAN:r;if(!rec)return;try{const res=await api('adminReadImage',state.token,rec.image_id,['FGAN','Barbershop'].includes(key)?'result':key);if(editor===target&&!target.files[key]){target.previews[key]=res.data;const img=document.getElementById('preview-'+key);if(img){img.src=res.data;img.hidden=false}}}catch(e){toast(e.message)}}))}
function editorHTML(){return `<section class="card" id="pairform" style="margin-bottom:20px"><div class="row between"><h3>${editor.isNew?'เพิ่มชุดภาพ':'แก้ไขชุดภาพ '+esc(editor.pair_id)}</h3><button class="ghost" onclick="if(!state.busy){editor=null;renderAdmin()}">ปิด ✕</button></div><form onsubmit="savePairForm(event)"><fieldset id="pairfields" style="border:0;padding:0;margin:0"><div class="filters"><label>ผู้เข้าร่วม<br><select id="pairparticipant" onchange="editor.participant_id=this.value" ${editor.isNew?'':'disabled'}>${state.management.participants.map(p=>`<option value="${esc(p.participant_id)}" ${p.participant_id===editor.participant_id?'selected':''}>${esc(p.participant_id)}</option>`).join('')}</select></label><label>รหัสคู่ทดลอง<br><input id="paircode" oninput="editor.pair_id=this.value" required pattern="[A-Za-z0-9_-]{1,60}" value="${esc(editor.pair_id)}" ${editor.isNew?'':'readonly'} placeholder="เช่น C01"></label><label>แสดงต่อผู้ประเมิน<br><select id="pairenabled" onchange="editor.enabled=this.value==='true'"><option value="true" ${editor.enabled?'selected':''}>เปิดใช้งาน</option><option value="false" ${editor.enabled?'':'selected'}>ซ่อนไว้ก่อน</option></select></label></div><div class="adminassets">${Object.entries(adminAssetLabels).map(([key,label])=>`<div class="uploadcard"><label for="upload-${key}">${label}</label><div class="uploadpreview"><img id="preview-${key}" ${editor.previews[key]?'src="'+esc(editor.previews[key])+'"':'hidden'} alt="${label}"></div><input id="upload-${key}" type="file" accept="image/jpeg,image/png,image/webp" onchange="pickAsset('${key}',this)"><p id="assetstatus-${key}" class="small muted">${editor.assets[key]?'มีภาพแล้ว เลือกไฟล์เพื่อเปลี่ยน':'ยังไม่มีภาพ'}</p>${['FGAN','Barbershop'].includes(key)?`<label class="small">การจูน <select id="variant-${key}" onchange="editor.records['${key}'].tuning_variant=this.value">${['V1','V2','V3','V4'].map(v=>`<option ${editor.records[key].tuning_variant===v?'selected':''}>${v}</option>`).join('')}</select></label><label class="small" style="display:block;margin-top:10px">เวลาที่วัดจริง (วินาที)<input id="seconds-${key}" oninput="editor.records['${key}'].generation_seconds=this.value" type="number" min="0" step="any" value="${esc(editor.records[key].generation_seconds)}" placeholder="เว้นว่างได้" style="width:100%"></label>`:''}</div>`).join('')}</div><p class="hint">เปลี่ยนภาพหรือเงื่อนไขเดิม จะสร้างเวอร์ชันใหม่ของทั้งคู่ คะแนนเก่ายังคงอยู่ในประวัติ ผู้ประเมินจะให้คะแนนเวอร์ชันใหม่<br>JPG / PNG / WebP ไม่เกิน 2 MB ต่อภาพ</p><div class="row"><button type="submit" id="pairsave">บันทึกชุดภาพ</button><button type="button" class="secondary" onclick="if(!state.busy){editor=null;renderAdmin()}">ยกเลิก</button></div></fieldset><p id="pairerror" role="alert" class="error"></p></form></section>`}
async function pickAsset(key,input){const file=input.files[0];if(!file||!editor)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>2097152){input.value='';toast('เลือก JPG/PNG/WebP ไม่เกิน 2 MB');return}const target=editor;try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(Error('อ่านไฟล์ไม่ได้'));r.readAsDataURL(file)});if(editor!==target)return;target.files[key]={mime:file.type,base64:data.split(',')[1]};target.previews[key]=data;const img=document.getElementById('preview-'+key);img.src=data;img.hidden=false;document.getElementById('assetstatus-'+key).textContent='เลือกภาพใหม่แล้ว (ยังไม่บันทึก)'}catch(e){toast(e.message)}}
async function reloadAdminData(){const [data,management]=await Promise.all([api('getDashboard',state.token),api('adminGetManagement',state.token)]);state.data=data;state.management=management;}
async function savePairForm(e){e.preventDefault();if(state.busy)return;const target=editor,p={participant_id:document.getElementById('pairparticipant').value,pair_id:document.getElementById('paircode').value.trim(),enabled:document.getElementById('pairenabled').value==='true',records:['FGAN','Barbershop'].map(model=>{const val=document.getElementById('seconds-'+model).value;return {image_id:target.records[model].image_id||'',fingerprint:target.records[model].fingerprint||'',model,tuning_variant:document.getElementById('variant-'+model).value,generation_seconds:val===''?'':Number(val)}})};for(const key of Object.keys(adminAssetLabels)){if(!target.assets[key]&&!target.files[key]){document.getElementById('pairerror').textContent='กรุณาเพิ่ม '+adminAssetLabels[key];return}}state.busy=true;document.getElementById('pairfields').disabled=true;try{for(const key of Object.keys(adminAssetLabels)){const f=target.files[key];if(f&&!f.uploaded){document.getElementById('pairsave').textContent='กำลังอัปโหลด '+adminAssetLabels[key]+'…';const r=await api('adminUploadImage',state.token,{mime:f.mime,base64:f.base64});f.uploaded=r.file_id;target.assets[key]=r.file_id;}}p.original_file_id=target.assets.original;p.hair_file_id=target.assets.hair;p.color_file_id=target.assets.color;p.records.forEach(r=>r.result_file_id=target.assets[r.model]);document.getElementById('pairsave').textContent='กำลังบันทึก…';const res=await api('adminSavePair',state.token,p);editor=null;await reloadAdminData();state.busy=false;renderAdmin();toast(res.revised?'สร้างเวอร์ชันใหม่แล้ว คะแนนเดิมอยู่ในประวัติ':'บันทึกชุดภาพแล้ว')}catch(err){state.busy=false;const f=document.getElementById('pairfields');if(f)f.disabled=false;const b=document.getElementById('pairsave');if(b)b.textContent='บันทึกชุดภาพ';const message=document.getElementById('pairerror');if(message)message.textContent=err.message;else toast('บันทึกแล้ว แต่อัปเดตหน้าไม่สำเร็จ กรุณากดอัปเดต')}}
async function togglePair(index,on){if(state.busy)return;const p=pairList[index];state.busy=true;try{await api('adminSetPairEnabled',state.token,p.participant_id,p.pair_id,Object.values(p.records).map(r=>r.image_id),on);await reloadAdminData();state.busy=false;renderAdmin();toast(on?'เปิดชุดภาพแล้ว':'ซ่อนชุดภาพแล้ว')}catch(e){state.busy=false;toast(e.message)}}
function openReset(id){if(state.busy)return;const dialog=document.getElementById('accountdialog');dialog.innerHTML=`<form onsubmit="resetAccount(event)"><h2>เปลี่ยนรหัส ${esc(id)}</h2><input id="resetpid" type="hidden" value="${esc(id)}"><label for="resetcode">รหัสตัวเลข 6 หลักใหม่</label><div class="row" style="margin:15px 0"><input id="resetcode" type="text" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required autocomplete="off"><button class="secondary" type="button" onclick="document.getElementById('resetcode').value=String(100000+crypto.getRandomValues(new Uint32Array(1))[0]%900000)">สุ่ม</button></div><p class="small muted">รหัสเก่าจะใช้ไม่ได้ ให้ส่งรหัสใหม่แก่เจ้าของรหัสเท่านั้น</p><div id="reseterror" class="error" role="alert"></div><button id="resetbtn" type="submit">บันทึกรหัสใหม่</button> <button class="secondary" type="button" onclick="document.getElementById('accountdialog').close()">ปิด</button></form>`;dialog.showModal()}

async function refreshParticipant(){try{const r=await api('getParticipant',state.token);state.items=r.items;state.answers=r.answers;state.index=Math.max(0,state.items.findIndex(x=>!state.answers[x.image_id]));await showImage()}catch(e){toast(e.message)}}
