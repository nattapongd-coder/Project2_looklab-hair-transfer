    <script>
      // Filter out benign TensorFlow Lite / MediaPipe WebAssembly C++ info messages routed to stderr/console.error
      (function() {
        var origError = console.error;
        console.error = function() {
          var first = arguments[0];
          if (typeof first === 'string' && (
            first.indexOf('TensorFlow Lite') !== -1 ||
            first.indexOf('XNNPACK') !== -1 ||
            first.indexOf('delegate for CPU') !== -1 ||
            first.indexOf('INFO:') === 0
          )) {
            if (console.info) {
              console.info.apply(console, arguments);
            }
            return;
          }
          return origError.apply(console, arguments);
        };
      })();
    </script>
